name: Sync server list

on:
  schedule:
    - cron: "17 3 * * 1"   # раз в неделю, понедельник 03:17 UTC
  workflow_dispatch: {}
  push:
    paths:
      - extra.txt
      - own_blacklist.txt
      - scripts/**

permissions:
  contents: write

concurrency:
  group: sync-servers
  cancel-in-progress: false

env:
  UPSTREAM: https://raw.githubusercontent.com/Caraekosiemah9ab/rawList/main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream lists
        run: |
          mkdir -p upstream
          curl -fsSL --retry 3 "$UPSTREAM/ms.txt"        -o upstream/ms.txt
          curl -fsSL --retry 3 "$UPSTREAM/blacklist.txt" -o upstream/blacklist.txt

      - name: Build v1/servers/cstrike
        run: python3 scripts/build_list.py

      - name: Commit (always on schedule, so GitHub does not pause it)
        run: |
          git config user.name  "server-list-bot"
          git config user.email "server-list-bot@users.noreply.github.com"
          git add upstream v1
          if git diff --cached --quiet; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              git commit --allow-empty -m "weekly check: no changes"
            else
              echo "no changes"; exit 0
            fi
          else
            git commit -m "sync server list"
          fi
          git pull --rebase
          git push
